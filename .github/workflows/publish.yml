name: npm-publish

on:
  push:
    branches:
      - master
      - labeled
      - assigned
      - synchronize

jobs:
  npm-publish:
    name: npm-publish
    runs-on: linux-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@master

    - name: Check if version has been updated
      id: check
      uses: EndBug/version-check@v6
      with:
        file-url: https://unpkg.com/react-router-cache-route/package.json
        static-checking: localIsNew
    
    - name: Output version check result
      run: 'echo "changed: ${{ steps.check.outputs.changed }}, version: ${{ steps.check.outputs.version }}"'

    - name: Log if version has been updated
      if: steps.check.outputs.changed == 'true'
      run: 'echo "Version change found in commit ${{ steps.check.outputs.commit }}! New version: ${{ steps.check.outputs.version }} (${{ steps.check.outputs.type }})"'

    - name: Set up Node.js
      if: steps.check.outputs.changed == 'true'
      uses: actions/setup-node@master
      with:
        node-version: 20.13.5

    - name: Install Dependencies
      if: steps.check.outputs.changed == 'true'
      uses: bahmutov/npm-install@v1
      with:
        useLockFile: true
        args: install artifact

    - name: Build
      if: steps.check.outputs.changed == 'true'
      run: 'sudo npm run build'

    - name: Publish
      if: steps.check.outputs.changed == 'true'
      uses: pascalgn/npm-publish-action@1.5.9
      with:
        commit_pattern: "^Release (\\S+)"
      env:
        NPM_AUTH_TOKEN: ${{ secrets.NPM_AUTH_TOKEN }}
